name: android-core

on:
  push:
    paths:
      - "android/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/android-core.yml"
  pull_request:
    paths:
      - "android/**"
      - "src/**"
      - "CMakeLists.txt"
      - ".github/workflows/android-core.yml"

jobs:
  configure-arm64-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Android ARM64 core
        shell: bash
        run: |
          set -euo pipefail
          cmake             -S .             -B build-android-arm64             -DCMAKE_SYSTEM_NAME=Android             -DCMAKE_SYSTEM_VERSION=26             -DCMAKE_ANDROID_ARCH_ABI=arm64-v8a             -DCMAKE_ANDROID_NDK="$ANDROID_NDK_ROOT"             -DQUINTUM_BUILD_GUI=OFF

      - name: Build Android ARM64 core
        run: cmake --build build-android-arm64 --target quintum_android --parallel 2

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Install Android CMake 3.22.1
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'cmake;3.22.1'
          test -x "$ANDROID_HOME/cmake/3.22.1/bin/cmake"

      - name: Run Android unit tests
        working-directory: android
        run: gradle testDebugUnitTest --no-daemon

      - name: Build Android Testnet APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Verify APK contains ARM64 native core
        shell: bash
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          test -s "$apk"
          unzip -Z1 "$apk" | grep -Fx 'lib/arm64-v8a/libquintum_android.so'

      - name: Upload Android Testnet APK
        uses: actions/upload-artifact@v4
        with:
          name: quintum-android-testnet-arm64
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

name: gui

on:
  push:
  pull_request:

env:
  APP_VERSION: 0.0.2-prealpha
  QT_VERSION: 6.8.0

jobs:
  gui-linux:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libfontconfig1 \
            libxkbcommon-x11-0 \
            libxcb-cursor0 \
            libxcb-xinerama0 \
            libxcb-xkb1

      - name: Install Qt 6.8
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt linux desktop "${QT_VERSION}" linux_gcc_64 -O "$GITHUB_WORKSPACE/Qt"
          config="$(find "$GITHUB_WORKSPACE/Qt" -name Qt6Config.cmake -print -quit)"
          test -n "$config"
          prefix="$(dirname "$(dirname "$(dirname "$(dirname "$config")")")")"
          echo "QT_ROOT=$prefix" >> "$GITHUB_ENV"

      - name: Configure GUI
        run: >
          cmake -S . -B build-gui
          -DQUINTUM_BUILD_GUI=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT }}"

      - name: Build GUI
        run: cmake --build build-gui --target quintum_qt -j2

      - name: Smoke GUI runtime
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build-gui/QUINTUM --smoke-test

      - name: Build Linux installers
        shell: bash
        run: |
          chmod +x packaging/linux/build-desktop-package.sh packaging/linux/quintum-launcher.sh
          mkdir -p dist/linux-release
          packaging/linux/build-desktop-package.sh \
            build-gui/QUINTUM \
            "$QT_ROOT" \
            "$APP_VERSION" \
            dist/linux-release

      - name: Smoke portable Linux package
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: dist/linux-release/QUINTUM/run-quintum.sh --smoke-test

      - name: Smoke installed DEB
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          sudo dpkg -i "dist/linux-release/QUINTUM-Core-${APP_VERSION}-linux-x64.deb"
          /usr/bin/quintum --smoke-test
          sudo dpkg -r quintum-core

      - name: Upload Linux desktop packages
        uses: actions/upload-artifact@v4
        with:
          name: quintum-linux-desktop-x64
          path: |
            dist/linux-release/*.deb
            dist/linux-release/*.tar.gz
          if-no-files-found: error

  gui-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt 6.8
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt windows desktop $env:QT_VERSION win64_msvc2022_64 -O "$env:GITHUB_WORKSPACE\Qt"
          $config = Get-ChildItem -Path "$env:GITHUB_WORKSPACE\Qt" -Filter Qt6Config.cmake -Recurse | Select-Object -First 1
          if (-not $config) { throw "Qt6Config.cmake not found" }
          $prefix = Split-Path (Split-Path (Split-Path (Split-Path $config.FullName -Parent) -Parent) -Parent) -Parent
          "QT_ROOT=$prefix" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Configure GUI
        shell: pwsh
        run: >
          cmake -S . -B build-gui
          -DQUINTUM_BUILD_GUI=ON
          "-DCMAKE_PREFIX_PATH=$env:QT_ROOT"

      - name: Build GUI
        run: cmake --build build-gui --config Release --target quintum_qt

      - name: Smoke GUI runtime
        shell: pwsh
        run: |
          $env:PATH = "$env:QT_ROOT\bin;$env:PATH"
          $env:QT_QPA_PLATFORM = "offscreen"
          & ".\build-gui\Release\QUINTUM.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Stage deployable Windows folder
        shell: pwsh
        run: |
          $stage = Join-Path $PWD "dist\windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item ".\build-gui\Release\QUINTUM.exe" (Join-Path $stage "QUINTUM.exe")
          Copy-Item ".\README.md" (Join-Path $stage "README.md")
          Copy-Item ".\docs\TESTNET_TESTING.md" (Join-Path $stage "TESTNET_TESTING.md")

          $deploy = Join-Path $env:QT_ROOT "bin\windeployqt.exe"
          if (-not (Test-Path $deploy)) { throw "windeployqt.exe not found" }

          & $deploy --release --dir $stage (Join-Path $stage "QUINTUM.exe")
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          if (-not (Test-Path (Join-Path $stage "Qt6Core.dll"))) {
            throw "Qt6Core.dll was not deployed"
          }
          if (-not (Test-Path (Join-Path $stage "platforms\qwindows.dll"))) {
            throw "qwindows.dll was not deployed"
          }

      - name: Smoke portable deployment
        shell: pwsh
        run: |
          $env:QT_QPA_PLATFORM = "offscreen"
          & ".\dist\windows\QUINTUM.exe" --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $iscc = (Get-Command ISCC.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) {
            $candidates = @(
              "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 6\ISCC.exe",
              "${env:ProgramFiles(x86)}\Inno Setup 7\ISCC.exe",
              "$env:ProgramFiles\Inno Setup 7\ISCC.exe"
            )
            $iscc = $candidates | Where-Object { $_ -and (Test-Path $_) } | Select-Object -First 1
          }
          if (-not $iscc) { throw "Inno Setup ISCC.exe not found" }

          $source = (Resolve-Path ".\dist\windows").Path
          $output = Join-Path $PWD "dist\installer"
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          & $iscc "/DSourceDir=$source" "/DOutputDir=$output" "/DAppVersion=$env:APP_VERSION" ".\packaging\windows\quintum.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $installer = Get-ChildItem $output -Filter "QUINTUM-Core-Setup-*.exe" | Select-Object -First 1
          if (-not $installer) { throw "QUINTUM installer was not produced" }

      - name: Smoke install update uninstall and preserve data
        shell: pwsh
        run: |
          $installer = (Get-ChildItem ".\dist\installer" -Filter "QUINTUM-Core-Setup-*.exe" | Select-Object -First 1).FullName
          if (-not $installer) { throw "Installer missing" }

          $installDir = Join-Path $env:RUNNER_TEMP "quintum-install"
          $dataDir = Join-Path $env:APPDATA "QUINTUM\QUINTUM Core\randomx-testnet"
          $sentinel = Join-Path $dataDir "installer-preserve-sentinel.txt"

          New-Item -ItemType Directory -Force -Path $dataDir | Out-Null
          Set-Content -Path $sentinel -Value "preserve-me"

          $args = @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/DIR=$installDir")
          $first = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($first.ExitCode -ne 0) { exit $first.ExitCode }

          if (-not (Test-Path (Join-Path $installDir "QUINTUM.exe"))) {
            throw "Installed QUINTUM.exe missing"
          }

          $env:QT_QPA_PLATFORM = "offscreen"
          & (Join-Path $installDir "QUINTUM.exe") --smoke-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $running = Start-Process -FilePath (Join-Path $installDir "QUINTUM.exe") -ArgumentList "--installer-hold-test" -PassThru
          Start-Sleep -Seconds 2
          if ($running.HasExited) { throw "Installed QUINTUM did not stay running for update test" }

          $second = Start-Process -FilePath $installer -ArgumentList $args -Wait -PassThru
          if ($second.ExitCode -ne 0) {
            if (-not $running.HasExited) { Stop-Process -Id $running.Id -Force }
            exit $second.ExitCode
          }

          $running.Refresh()
          if (-not $running.HasExited) {
            Stop-Process -Id $running.Id -Force
            throw "Installer update did not close the running QUINTUM.exe"
          }

          if (-not (Test-Path $sentinel)) {
            throw "User data was removed during installer update"
          }

          $uninstaller = Join-Path $installDir "unins000.exe"
          if (-not (Test-Path $uninstaller)) { throw "Uninstaller missing" }

          $uninstall = Start-Process -FilePath $uninstaller -ArgumentList @("/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { exit $uninstall.ExitCode }

          if (-not (Test-Path $sentinel)) {
            throw "User data was removed by uninstall"
          }

          Remove-Item -Recurse -Force (Join-Path $env:APPDATA "QUINTUM") -ErrorAction SilentlyContinue

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: quintum-windows-x64
          path: dist/installer/*.exe
          if-no-files-found: error

  gui-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Qt 6.8
        shell: bash
        run: |
          python -m pip install --disable-pip-version-check aqtinstall==3.3.0
          python -m aqt install-qt mac desktop "$QT_VERSION" clang_64 -O "$GITHUB_WORKSPACE/Qt"
          config="$(find "$GITHUB_WORKSPACE/Qt" -name Qt6Config.cmake -print -quit)"
          test -n "$config"
          prefix="$(dirname "$(dirname "$(dirname "$(dirname "$config")")")")"
          echo "QT_ROOT=$prefix" >> "$GITHUB_ENV"
          echo "Runner architecture: $(uname -m)"

      - name: Configure GUI
        shell: bash
        run: >
          cmake -S . -B build-gui
          -DQUINTUM_BUILD_GUI=ON
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="$QT_ROOT"

      - name: Build GUI
        shell: bash
        run: cmake --build build-gui --target quintum_qt -j2

      - name: Smoke GUI runtime
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ./build-gui/QUINTUM.app/Contents/MacOS/QUINTUM --smoke-test

      - name: Build macOS DMG and ZIP
        shell: bash
        run: |
          chmod +x packaging/macos/build-dmg.sh
          mkdir -p dist/macos
          packaging/macos/build-dmg.sh \
            build-gui/QUINTUM.app \
            "$QT_ROOT" \
            "$APP_VERSION" \
            "${{ matrix.arch }}" \
            dist/macos

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: quintum-macos-${{ matrix.arch }}
          path: |
            dist/macos/*.dmg
            dist/macos/*.zip
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - gui-linux
      - gui-windows
      - gui-macos
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all desktop packages
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Build unified SHA256SUMS
        shell: bash
        run: |
          cd release-assets
          mapfile -t files < <(
            find . -maxdepth 1 -type f \
              \( -name '*.exe' -o -name '*.deb' -o -name '*.tar.gz' -o -name '*.dmg' -o -name '*.zip' \) \
              -printf '%f\n' | sort
          )
          test "${#files[@]}" -ge 6
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish cross-platform RandomX pre-alpha release
        uses: ncipollo/release-action@v1
        with:
          tag: v0.0.2-prealpha
          commit: ${{ github.sha }}
          name: QUINTUM Core RandomX Testnet v0.0.2-prealpha
          bodyFile: docs/releases/v0.0.2-prealpha.md
          prerelease: true
          skipIfReleaseExists: true
          immutableCreate: true
          artifactErrorsFailBuild: true
          artifacts: "release-assets/*.exe,release-assets/*.deb,release-assets/*.tar.gz,release-assets/*.dmg,release-assets/*.zip,release-assets/SHA256SUMS.txt"
